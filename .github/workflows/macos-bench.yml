name: macOS Timer Benchmark

on:
  push:
    branches:
      - 'exp/**'
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: "Intel Mac (native x86_64)"
            use_rosetta: false
          - os: macos-latest
            name: "Apple Silicon (Rosetta 2 x86_64)"
            use_rosetta: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rosetta 2
        if: matrix.use_rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Compile and Run Benchmark (x86_64)
        run: |
          echo "=== Compiling bench_macos_timer (x86_64) ==="
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -DAPS5_PRECISE_WAIT_TRACE=1 -Icore/libs tools/bench_macos_timer.cpp -o bench_macos
          echo "=== Running bench_macos_timer (x86_64) ==="
          ./bench_macos

      - name: Compile and Run PreciseWait Unit Tests (x86_64)
        run: |
          echo "=== Compiling PreciseWait Unit Tests (x86_64) ==="
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -Icore/libs core/libs/tests/PreciseWait.cpp -o precise_wait_tests
          echo "=== Running PreciseWait Unit Tests (APS5_SKIP_TIMING_TESTS=1) ==="
          APS5_SKIP_TIMING_TESTS=1 ./precise_wait_tests
          echo "Unit tests passed with 0 early returns."

  windows-test:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and Run PreciseWait Unit Tests (clang-cl)
        shell: cmd
        run: |
          echo "=== Compiling with clang-cl ==="
          clang-cl /EHsc /std:c++20 /O2 /DNDEBUG /Icore/libs core/libs/tests/PreciseWait.cpp /Feprecise_wait_clangcl.exe
          set APS5_SKIP_TIMING_TESTS=1
          precise_wait_clangcl.exe
          echo "clang-cl tests passed."

      - name: Compile and Run PreciseWait Unit Tests (MSVC cl)
        shell: cmd
        run: |
          echo "=== Compiling with MSVC cl ==="
          cl /EHsc /std:c++20 /O2 /DNDEBUG /Icore/libs core/libs/tests/PreciseWait.cpp /Feprecise_wait_msvc.exe
          set APS5_SKIP_TIMING_TESTS=1
          precise_wait_msvc.exe
          echo "MSVC cl tests passed."
