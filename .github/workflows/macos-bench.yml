name: macOS Timer Benchmark

on:
  push:
    branches:
      - 'exp/**'
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Run Benchmark
        run: |
          echo "=== Compiling bench_macos_timer ==="
          clang++ -std=c++20 -O3 -DNDEBUG -Icore/libs tools/bench_macos_timer.cpp -o bench_macos
          echo "=== Running bench_macos_timer ==="
          ./bench_macos

      - name: Compile and Run PreciseWait Unit Tests
        run: |
          echo "=== Compiling PreciseWait Unit Tests ==="
          clang++ -std=c++20 -O3 -DNDEBUG -Icore/libs core/libs/tests/PreciseWait.cpp -o precise_wait_tests
          echo "=== Running PreciseWait Unit Tests (APS5_SKIP_TIMING_TESTS=1) ==="
          APS5_SKIP_TIMING_TESTS=1 ./precise_wait_tests
          echo "Unit tests passed with 0 early returns."
