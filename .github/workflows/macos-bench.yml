name: macOS Timer Benchmark

on:
  push:
    branches:
      - 'exp/**'
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Run Benchmark
        run: |
          echo "=== Compiling bench_macos_timer ==="
          clang++ -std=c++20 -O3 -DNDEBUG -DAPS5_PRECISE_WAIT_TRACE=1 -Icore/libs tools/bench_macos_timer.cpp -o bench_macos
          echo "=== Running bench_macos_timer ==="
          ./bench_macos

      - name: Compile and Run PreciseWait Unit Tests
        run: |
          echo "=== Compiling PreciseWait Unit Tests ==="
          clang++ -std=c++20 -O3 -DNDEBUG -Icore/libs core/libs/tests/PreciseWait.cpp -o precise_wait_tests
          echo "=== Running PreciseWait Unit Tests (APS5_SKIP_TIMING_TESTS=1) ==="
          APS5_SKIP_TIMING_TESTS=1 ./precise_wait_tests
          echo "Unit tests passed with 0 early returns."

  windows-test:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and Run PreciseWait Unit Tests (clang-cl)
        shell: cmd
        run: |
          echo "=== Compiling with clang-cl ==="
          clang-cl /EHsc /std:c++20 /O2 /DNDEBUG /Icore/libs core/libs/tests/PreciseWait.cpp /Feprecise_wait_clangcl.exe
          set APS5_SKIP_TIMING_TESTS=1
          precise_wait_clangcl.exe
          echo "clang-cl tests passed."

      - name: Compile and Run PreciseWait Unit Tests (MSVC cl)
        shell: cmd
        run: |
          echo "=== Compiling with MSVC cl ==="
          cl /EHsc /std:c++20 /O2 /DNDEBUG /Icore/libs core/libs/tests/PreciseWait.cpp /Feprecise_wait_msvc.exe
          set APS5_SKIP_TIMING_TESTS=1
          precise_wait_msvc.exe
          echo "MSVC cl tests passed."
