name: macOS Production x86_64 Disassembly Analysis

on:
  push:
    branches:
      - 'exp/**'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to checkout (empty for caller ref)'
        required: false
        default: ''
      baseline_sha:
        description: 'Baseline commit for short-wait A/B (empty for previous commit)'
        required: false
        default: ''

jobs:
  disassembly:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: "Intel Mac (native x86_64)"
            artifact_name: macos-intel-x86_64-production-disassembly
            use_rosetta: false
          - os: macos-latest
            name: "Apple Silicon (Rosetta 2 x86_64)"
            artifact_name: macos-apple-silicon-rosetta-x86_64-production-disassembly
            use_rosetta: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.ref }}
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive --depth 1

      - name: Install Rosetta 2
        if: matrix.use_rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Create Disassembly Harness and Output Directories
        run: |
          mkdir -p output/metadata
          mkdir -p output/level1_harness/production
          mkdir -p output/level1_harness/diagnostic
          mkdir -p output/level2_cmake_objects
          mkdir -p output/level3_production_prx
          mkdir -p output/level3_diagnostic_prx
          mkdir -p output/call_sites

          cat << 'EOF' > tools/disasm_precise_wait.cpp
          #include "prx/libc/include/PreciseWait.hpp"

          extern "C" {
          void export_PreciseSleepUs(unsigned long long us) {
              PreciseSleepUs(us);
          }
          void export_PreciseSleepNanos(unsigned long long nanos) {
          #if !defined(_WIN32)
              PreciseSleepNanos(nanos);
          #else
              (void)nanos;
          #endif
          }
          void export_PreciseSleepUntil_steady(std::int64_t nanos) {
              PreciseSleepUntil(std::chrono::steady_clock::time_point(std::chrono::nanoseconds(nanos)));
          }
          bool export_PreciseAppleLowTimerSlack() {
          #if defined(__APPLE__)
              return PreciseAppleLowTimerSlack();
          #else
              return false;
          #endif
          }
          std::uint64_t export_PreciseSafeDurationToNanos_int64(std::int64_t d) {
              return PreciseSafeDurationToNanos(std::chrono::nanoseconds(d));
          }
          std::uint64_t export_PreciseSafeDurationToNanos_double(double d) {
              return PreciseSafeDurationToNanos(std::chrono::duration<double>(d));
          }
          std::uint64_t export_PreciseSafeDurationToNanos_double_kilo(double d) {
              return PreciseSafeDurationToNanos(std::chrono::duration<double, std::kilo>(d));
          }
          std::uint64_t export_PreciseSafeDurationToNanos_double_nano(double d) {
              return PreciseSafeDurationToNanos(std::chrono::duration<double, std::nano>(d));
          }
          #if defined(__SIZEOF_INT128__)
          std::uint64_t export_PreciseSafeDurationToNanos_int128(unsigned __int128 d) {
              return PreciseSafeDurationToNanos(std::chrono::duration<unsigned __int128, std::milli>(d));
          }
          #endif
          std::uint64_t export_PreciseSafeDurationToNanos_custom_ratio(std::int64_t d) {
              return PreciseSafeDurationToNanos(std::chrono::duration<std::int64_t, std::ratio<1, 1000000000000000000LL>>(d));
          }
          std::uint64_t export_PreciseMulDivCeilFallback64(std::uint64_t r, std::uint64_t num, std::uint64_t den) {
              return PreciseMulDivCeilFallback64(r, num, den);
          }
          }

          #if defined(__APPLE__)
          mach_timebase_info_data_t export_PreciseMachTimebase() {
              return PreciseMachTimebase();
          }
          PreciseMachDeadlineResult export_PreciseComputeMachDeadline(std::uint64_t nanos, std::uint32_t numer, std::uint32_t denom, std::uint64_t now) {
              return PreciseComputeMachDeadline(nanos, numer, denom, now);
          }
          #endif
          PreciseMachDeadlineResult export_PreciseComputeMachDeadline64(std::uint64_t nanos, std::uint32_t numer, std::uint32_t denom, std::uint64_t now) {
              return PreciseComputeMachDeadline64(nanos, numer, denom, now);
          }
          EOF

          cat << 'EOF' > tools/bench_production.cpp
          #include "prx/libc/include/PreciseWait.hpp"
          #include <algorithm>
          #include <cstdlib>
          #include <cstdint>
          #include <iostream>
          #include <iomanip>
          #include <numeric>
          #include <string>
          #include <thread>
          #include <vector>
          #include <time.h>

          static std::uint64_t ReadNanos(clockid_t clockId) {
              struct timespec ts{};
              if (clock_gettime(clockId, &ts) != 0) {
                  std::abort();
              }
              return static_cast<std::uint64_t>(ts.tv_sec) * 1000000000ULL + static_cast<std::uint64_t>(ts.tv_nsec);
          }

          static void Run(const std::string& variant, const std::string& round, unsigned long long sleepUs) {
              constexpr int warmupCount = 50;
              constexpr int sampleCount = 3000;
              std::vector<double> wallUs;
              std::vector<double> cpuUs;
              std::uint64_t earlyReturns = 0;
              wallUs.reserve(sampleCount);
              cpuUs.reserve(sampleCount);
              {
                  std::thread worker([&] {
                      for (int i = 0; i < warmupCount; ++i) {
                          PreciseSleepUs(sleepUs);
                      }
                      for (int i = 0; i < sampleCount; ++i) {
                          const std::uint64_t wall0 = ReadNanos(CLOCK_MONOTONIC_RAW);
                          PreciseSleepUs(sleepUs);
                          const std::uint64_t wall1 = ReadNanos(CLOCK_MONOTONIC_RAW);
                          if (wall1 < wall0) {
                              std::abort();
                          }
                          if (wall1 - wall0 < sleepUs * 1000ULL) {
                              ++earlyReturns;
                          }
                          wallUs.push_back(static_cast<double>(wall1 - wall0) / 1000.0);
                      }
                  });
                  worker.join();
              }
              {
                  std::thread worker([&] {
                      for (int i = 0; i < warmupCount; ++i) {
                          PreciseSleepUs(sleepUs);
                      }
                      for (int i = 0; i < sampleCount; ++i) {
                          const std::uint64_t cpu0 = ReadNanos(CLOCK_THREAD_CPUTIME_ID);
                          PreciseSleepUs(sleepUs);
                          const std::uint64_t cpu1 = ReadNanos(CLOCK_THREAD_CPUTIME_ID);
                          if (cpu1 < cpu0) {
                              std::abort();
                          }
                          cpuUs.push_back(static_cast<double>(cpu1 - cpu0) / 1000.0);
                      }
                  });
                  worker.join();
              }
              std::sort(wallUs.begin(), wallUs.end());
              std::sort(cpuUs.begin(), cpuUs.end());
              const double wallMean = std::accumulate(wallUs.begin(), wallUs.end(), 0.0) / sampleCount;
              const double cpuMean = std::accumulate(cpuUs.begin(), cpuUs.end(), 0.0) / sampleCount;
              std::cout << variant << ',' << round << ',' << sleepUs << ','
                        << std::fixed << std::setprecision(3)
                        << wallUs[sampleCount / 2] << ',' << wallUs[sampleCount * 90 / 100] << ','
                        << wallUs[sampleCount * 99 / 100] << ',' << wallMean << ','
                        << cpuUs[sampleCount / 2] << ',' << cpuUs[sampleCount * 90 / 100] << ','
                        << cpuUs[sampleCount * 99 / 100] << ',' << cpuMean << ',' << earlyReturns << '\n';
          }

          int main(int argc, char** argv) {
              const std::string variant = argc > 1 ? argv[1] : "unknown";
              const std::string round = argc > 2 ? argv[2] : "0";
              constexpr unsigned long long waitValues[] = {10ULL, 30ULL, 50ULL};
              for (const unsigned long long sleepUs : waitValues) {
                  Run(variant, round, sleepUs);
              }
              return 0;
          }
          EOF

          cat << 'EOF' > tools/disasm_short_wait.cpp
          #include "prx/libc/include/PreciseWait.hpp"

          extern "C" {
          void export_PreciseSleepUs_10() { PreciseSleepUs(10); }
          void export_PreciseSleepUs_30() { PreciseSleepUs(30); }
          void export_PreciseSleepUs_50() { PreciseSleepUs(50); }
          void export_PreciseSleepUs_dynamic(unsigned long long micros) { PreciseSleepUs(micros); }
          }
          EOF

      - name: Gather Toolchain and Environment Metadata
        run: |
          META_FILE="output/metadata/metadata.txt"
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "=== Commit & Environment Metadata ===" > "$META_FILE"
          echo "Environment: ${{ matrix.name }}" >> "$META_FILE"
          echo "Requested SHA: ${{ inputs.commit_sha }}" >> "$META_FILE"
          echo "Checked-out SHA: $ACTUAL_SHA" >> "$META_FILE"
          echo "Git Branch/Ref: ${{ github.ref }}" >> "$META_FILE"
          echo "Date (UTC): $(date -u)" >> "$META_FILE"
          echo "Architecture (uname -m): $(uname -m)" >> "$META_FILE"
          echo "Kernel (uname -a): $(uname -a)" >> "$META_FILE"
          echo "Rosetta translated proc (sysctl): $(sysctl -in sysctl.proc_translated || echo 0)" >> "$META_FILE"
          echo "" >> "$META_FILE"
          echo "OS Version (sw_vers):" >> "$META_FILE"
          sw_vers >> "$META_FILE" 2>&1 || true
          echo "" >> "$META_FILE"
          echo "macOS SDK Version:" >> "$META_FILE"
          xcrun --show-sdk-version >> "$META_FILE" 2>&1 || true
          echo "macOS SDK Path:" >> "$META_FILE"
          xcrun --show-sdk-path >> "$META_FILE" 2>&1 || true
          echo "" >> "$META_FILE"
          echo "Clang Version:" >> "$META_FILE"
          clang++ --version >> "$META_FILE" 2>&1 || true

      - name: Level 1 - Build and Disassemble Standalone Harness (x86_64)
        env:
          BASELINE_SHA_INPUT: ${{ inputs.baseline_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          PROD_DIR="output/level1_harness/production"
          BASE_DIR="output/level1_harness/baseline"
          DIAG_DIR="output/level1_harness/diagnostic"
          BENCH_DIR="output/short_wait_ab"
          mkdir -p "$BASE_DIR"
          mkdir -p "$BENCH_DIR"

          BASELINE_SHA="$BASELINE_SHA_INPUT"
          if [ -z "$BASELINE_SHA" ]; then
            BASELINE_SHA="$PUSH_BEFORE"
          fi
          if [ -z "$BASELINE_SHA" ] || [ "$BASELINE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASELINE_SHA="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$BASELINE_SHA:core/libs/prx/libc/include/PreciseWait.hpp"
          echo "$BASELINE_SHA" > "$BENCH_DIR/baseline_sha.txt"
          mkdir -p "$BASE_DIR/include/prx/libc/include"
          git show "$BASELINE_SHA:core/libs/prx/libc/include/PreciseWait.hpp" > "$BASE_DIR/include/prx/libc/include/PreciseWait.hpp"

          echo "=== Compiling Level 1 Pure Production PreciseWait (x86_64) ==="
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -Icore/libs tools/disasm_precise_wait.cpp -c -o "$PROD_DIR/precise_wait.o"
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -Icore/libs tools/disasm_precise_wait.cpp -S -o "$PROD_DIR/precise_wait.s"
          xcrun llvm-objdump --macho --disassemble --demangle "$PROD_DIR/precise_wait.o" > "$PROD_DIR/precise_wait.x86_64.asm.txt"
          xcrun otool -tvV "$PROD_DIR/precise_wait.o" > "$PROD_DIR/precise_wait.x86_64.otool.txt"
          nm -nm "$PROD_DIR/precise_wait.o" > "$PROD_DIR/precise_wait.symbols.txt"

          echo "=== Compiling Baseline Production PreciseWait (x86_64) ==="
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -I"$BASE_DIR/include" tools/disasm_short_wait.cpp -c -o "$BASE_DIR/short_wait_probe.o"
          xcrun llvm-objdump --macho --disassemble --demangle "$BASE_DIR/short_wait_probe.o" > "$BASE_DIR/short_wait_probe.x86_64.asm.txt"

          echo "=== Compiling Baseline and Candidate Short-Wait Benchmarks (x86_64) ==="
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -I"$BASE_DIR/include" tools/bench_production.cpp -o "$BENCH_DIR/bench_baseline"
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -Icore/libs tools/bench_production.cpp -o "$BENCH_DIR/bench_candidate"
          echo "variant,round,target_us,wall_p50_us,wall_p90_us,wall_p99_us,wall_mean_us,cpu_p50_us,cpu_p90_us,cpu_p99_us,cpu_mean_us,early_returns" > "$BENCH_DIR/results.csv"
          for round in 1 2 3 4 5; do
            if [ $((round % 2)) -eq 1 ]; then
              "$BENCH_DIR/bench_baseline" baseline "$round" >> "$BENCH_DIR/results.csv"
              "$BENCH_DIR/bench_candidate" candidate "$round" >> "$BENCH_DIR/results.csv"
            else
              "$BENCH_DIR/bench_candidate" candidate "$round" >> "$BENCH_DIR/results.csv"
              "$BENCH_DIR/bench_baseline" baseline "$round" >> "$BENCH_DIR/results.csv"
            fi
          done

          echo "=== Compiling Candidate Pure Production bench_macos (x86_64) ==="
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -Icore/libs tools/disasm_short_wait.cpp -c -o "$PROD_DIR/short_wait_probe.o"
          xcrun llvm-objdump --macho --disassemble --demangle "$PROD_DIR/short_wait_probe.o" > "$PROD_DIR/short_wait_probe.x86_64.asm.txt"
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -Icore/libs tools/bench_production.cpp -o "$PROD_DIR/bench_macos"
          xcrun llvm-objdump --macho --disassemble --demangle "$PROD_DIR/bench_macos" > "$PROD_DIR/bench_macos.x86_64.asm.txt"
          nm -nm "$PROD_DIR/bench_macos" > "$PROD_DIR/bench_macos.symbols.txt"

          echo "=== Compiling Level 1 Diagnostic PreciseWait (-g, x86_64) ==="
          clang++ -std=c++20 -O3 -DNDEBUG -g -arch x86_64 -Icore/libs tools/disasm_precise_wait.cpp -c -o "$DIAG_DIR/precise_wait_diag.o"
          xcrun llvm-objdump --macho --disassemble --demangle --source "$DIAG_DIR/precise_wait_diag.o" > "$DIAG_DIR/precise_wait_diag.x86_64.source_asm.txt"

      - name: Level 2 - CMake Production Build (Release x86_64)
        run: |
          echo "=== Configuring CMake Production Build ==="
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_CXX_FLAGS="-Rpass=inline -Rpass-missed=inline -fsave-optimization-record" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

          cp build-macos/compile_commands.json output/metadata/compile_commands.json

          echo "=== Building Selected Production Call-Site Objects with Clang Inline Remarks ==="
          python3 - <<'PY' 2>&1 | tee output/metadata/inline_remarks.txt
          import json
          import os
          import shlex
          import subprocess

          wanted = {
              "core/libs/prx/libkernel/Apr/src/Apr.cpp",
              "core/libs/prx/libkernel/Aio/src/Aio.cpp",
              "core/libs/prx/libkernel/Socket/src/Udp.cpp",
              "core/libs/prx/libSceFont/src/State.cpp",
              "core/libs/prx/libSceVideoOut/src/VideoOutDriver.cpp",
              "core/libs/prx/libSceAudioOut/src/AudioOut.cpp",
          }
          with open("build-macos/compile_commands.json", encoding="utf-8") as source:
              commands = json.load(source)
          selected = {}
          for entry in commands:
              source = entry["file"].replace("\\", "/")
              for path in wanted:
                  if source.endswith("/" + path):
                      selected[path] = entry
          missing = wanted - selected.keys()
          if missing:
              raise SystemExit("Missing compile commands: " + ", ".join(sorted(missing)))
          with open("output/metadata/production_call_site_objects.txt", "w", encoding="utf-8") as manifest:
              for path in sorted(wanted):
                  entry = selected[path]
                  args = shlex.split(entry["command"])
                  object_path = os.path.normpath(os.path.join(entry["directory"], args[args.index("-o") + 1]))
                  print("=== " + path + " ===", flush=True)
                  result = subprocess.run(
                      args,
                      cwd=entry["directory"],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
                  print(result.stdout, end="", flush=True)
                  if result.returncode:
                      raise SystemExit(result.returncode)
                  print(object_path, file=manifest, flush=True)
          PY

      - name: Level 2 - Analyze Production Call Site Objects (.o)
        run: |
          OBJ_DIR="output/level2_cmake_objects"
          CALL_DIR="output/call_sites"

          echo "=== Collecting and Disassembling Selected Call-Site Objects ==="
          while IFS= read -r obj; do
            if [ ! -f "$obj" ]; then
              echo "Missing production call-site object: $obj" >&2
              exit 1
            fi
            base=$(basename "$obj")
            cp "$obj" "$OBJ_DIR/$base"
            xcrun llvm-objdump --macho --disassemble --demangle "$obj" > "$CALL_DIR/${base}.asm.txt"
            nm -nm "$obj" > "$CALL_DIR/${base}.symbols.txt"
          done < output/metadata/production_call_site_objects.txt

      - name: Level 3 - Disassemble and Analyze Built Production .prx
        run: |
          PRX_DIR="output/level3_production_prx"

          echo "=== Collecting Built Production .prx Files ==="
          find build-macos/core/libs/libs -name "*.prx" 2>/dev/null -exec cp {} "$PRX_DIR/" \; || true

          echo "=== Disassembling Production .prx Files ==="
          for prx in "$PRX_DIR"/*.prx; do
            [ -f "$prx" ] || continue
            name=$(basename "$prx")
            echo "Analyzing $name..."
            xcrun llvm-objdump --macho --disassemble --demangle "$prx" > "$PRX_DIR/${name}.asm.txt" 2>&1 || true
            xcrun otool -tvV "$prx" > "$PRX_DIR/${name}.otool.txt" 2>&1 || true
            nm -nm "$prx" > "$PRX_DIR/${name}.symbols.txt" 2>&1 || true
          done

      - name: Level 3 - CMake Diagnostic Build (-g x86_64)
        run: |
          echo "=== Configuring CMake Diagnostic Build (RelWithDebInfo) ==="
          cmake -S . -B build-macos-diag -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

          echo "=== Building Diagnostic Call-Site Objects ==="
          python3 - <<'PY'
          import json
          import os
          import shlex
          import subprocess

          wanted = {
              "core/libs/prx/libkernel/Apr/src/Apr.cpp",
              "core/libs/prx/libkernel/Aio/src/Aio.cpp",
              "core/libs/prx/libkernel/Socket/src/Udp.cpp",
              "core/libs/prx/libSceFont/src/State.cpp",
              "core/libs/prx/libSceVideoOut/src/VideoOutDriver.cpp",
              "core/libs/prx/libSceAudioOut/src/AudioOut.cpp",
          }
          with open("build-macos-diag/compile_commands.json", encoding="utf-8") as source:
              commands = json.load(source)
          selected = {}
          for entry in commands:
              source = entry["file"].replace("\\", "/")
              for path in wanted:
                  if source.endswith("/" + path):
                      selected[path] = entry
          missing = wanted - selected.keys()
          if missing:
              raise SystemExit("Missing diagnostic compile commands: " + ", ".join(sorted(missing)))
          with open("output/metadata/diagnostic_call_site_objects.txt", "w", encoding="utf-8") as manifest:
              for path in sorted(wanted):
                  entry = selected[path]
                  args = shlex.split(entry["command"])
                  object_path = os.path.normpath(os.path.join(entry["directory"], args[args.index("-o") + 1]))
                  print("=== " + path + " ===", flush=True)
                  result = subprocess.run(
                      args,
                      cwd=entry["directory"],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
                  print(result.stdout, end="", flush=True)
                  if result.returncode:
                      raise SystemExit(result.returncode)
                  print(object_path, file=manifest, flush=True)
          PY

          DIAG_DIR="output/level3_diagnostic_prx"
          while IFS= read -r obj; do
            if [ ! -f "$obj" ]; then
              echo "Missing diagnostic call-site object: $obj" >&2
              exit 1
            fi
            name=$(basename "$obj")
            xcrun llvm-objdump --macho --disassemble --demangle --source "$obj" > "$DIAG_DIR/${name}.source_asm.txt"
          done < output/metadata/diagnostic_call_site_objects.txt

      - name: Verify Production Artifacts and Call Sites
        run: |
          REPORT_FILE="output/verification_report.txt"
          echo "=== Production Artifacts & Call Sites Verification Report ===" > "$REPORT_FILE"
          echo "Environment: ${{ matrix.name }}" >> "$REPORT_FILE"
          echo "Commit SHA: $(git rev-parse HEAD)" >> "$REPORT_FILE"
          echo "Date (UTC): $(date -u)" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          echo "--- 1. Built PRX Libraries ---" >> "$REPORT_FILE"
          if ls output/level3_production_prx/*.prx 1> /dev/null 2>&1; then
            file output/level3_production_prx/*.prx >> "$REPORT_FILE" 2>&1
          else
          echo "Note: This macOS workflow analyzes selected production call-site objects; it does not produce the Linux/Windows PRX runtime libraries." >> "$REPORT_FILE"
          fi
          echo "" >> "$REPORT_FILE"

          echo "--- 2. Built Production Call Site Objects (.o) ---" >> "$REPORT_FILE"
          ls -lh output/level2_cmake_objects >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          echo "--- 3. Direct PreciseSleep Calls in Production Disassembly ---" >> "$REPORT_FILE"
          for asm_file in output/call_sites/*.asm.txt; do
            echo "$(basename "$asm_file"):" >> "$REPORT_FILE"
            if grep -nE 'callq.*(PreciseSleep|__Z[0-9]+PreciseSleep)' "$asm_file" >> "$REPORT_FILE"; then
              true
            else
              echo "No direct PreciseSleep call matched in this disassembly; inspect the complete function body and inline remarks." >> "$REPORT_FILE"
            fi
          done
          if grep -nE 'PreciseSleep.*(not inlined|inlined into)' output/metadata/inline_remarks.txt >> "$REPORT_FILE"; then
            true
          else
            echo "No PreciseSleep-specific inline remark was emitted; no inline conclusion is inferred from symbol absence." >> "$REPORT_FILE"
          fi
          echo "" >> "$REPORT_FILE"

          echo "--- 4. Sleep and Clock References in Production Disassembly ---" >> "$REPORT_FILE"
          grep -rnE 'nanosleep|clock_gettime|PreciseSleep' output/call_sites/*.asm.txt output/call_sites/*.symbols.txt >> "$REPORT_FILE" || true
          echo "" >> "$REPORT_FILE"
          echo "--- 5. Baseline vs Candidate Short-Wait Benchmark ---" >> "$REPORT_FILE"
          echo "Baseline commit: $(cat output/short_wait_ab/baseline_sha.txt)" >> "$REPORT_FILE"
          cat output/short_wait_ab/results.csv >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "--- 6. Baseline vs Candidate Constant and Dynamic Call-Site Disassembly ---" >> "$REPORT_FILE"
          grep -nE 'export_PreciseSleepUs_(10|30|50|dynamic)|PreciseSleepFromNanosWithSlack|_clock_gettime(_nsec_np)?|_nanosleep' output/level1_harness/baseline/short_wait_probe.x86_64.asm.txt output/level1_harness/production/short_wait_probe.x86_64.asm.txt >> "$REPORT_FILE" || true

          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Disassembly Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: output/
          if-no-files-found: error
